name: Isolated Windows tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - run: ./tests/Test-Engine.ps1
      - run: ./tests/Test-Recovery.ps1
      - run: ./tests/Test-CLI.ps1
